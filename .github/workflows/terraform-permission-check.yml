name: Terraform permission check

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/lambdas/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-permission-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Never give a fork PR access to the checker identity or Terraform state.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_WORKSPACE: default
      DEPLOYER_ROLE_ARN: arn:aws:iam::240742387601:role/github-terraform-deployer
    steps:
      - name: Checkout PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.3'
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Debug OIDC subject (temporary)
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log(payload.sub);

      - name: Authenticate checker with AWS OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::240742387601:role/github-terraform-plan-checker
          aws-region: eu-west-1
          allowed-account-ids: '240742387601'

      - name: Initialize existing backend
        run: terraform init

      - name: Check formatting
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate

      - name: Generate read-only plan
        # No state lock writes, state persistence, or apply. Do not upload plan/state artifacts.
        run: |
          terraform plan -lock=false -out="$RUNNER_TEMP/permission-check.tfplan"
          terraform show -json "$RUNNER_TEMP/permission-check.tfplan" > "$RUNNER_TEMP/permission-check.json"

      - name: Simulate deployer permissions
        run: >-
          node ../scripts/check-terraform-permissions.mjs
          "$RUNNER_TEMP/permission-check.json"
          .terraform/terraform.tfstate

      - name: Explain earlier failure
        if: failure()
        run: |
          echo 'Terraform permission check failed. See step logs and the permissions table when available. A failed init/plan checks the checker role, not the deployment role. No deployment was performed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local plan files
        if: always()
        run: rm -f "$RUNNER_TEMP/permission-check.tfplan" "$RUNNER_TEMP/permission-check.json"
