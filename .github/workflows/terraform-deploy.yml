name: Terraform deployment

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.16.3'

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log("OIDC sub:", payload.sub);
            console.log("OIDC aud:", payload.aud);

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::240742387601:role/github-terraform-deployer
          aws-region: eu-west-1
          allowed-account-ids: '240742387601'

      - name: Initialize Terraform
        run: terraform init

      - name: Check formatting
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate

      - name: Plan deployment
        run: terraform plan -out=tfplan

      - name: Apply saved plan
        run: terraform apply -auto-approve tfplan
